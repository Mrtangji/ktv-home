# 本地开发用：仅启动 PostgreSQL，应用在 IDE / mvn 中运行
# 用法：docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    container_name: ktv-db-dev
    volumes:
      - ktv-pg-dev:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=ktv
      - POSTGRES_PASSWORD=ktv
      - POSTGRES_DB=ktv
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktv -d ktv"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ktv-pg-dev:
