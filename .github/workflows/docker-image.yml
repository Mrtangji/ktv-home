name: Docker Image CI

# Builds the server image from backend/Dockerfile and publishes it to GHCR
# and Docker Hub.
# 从 backend/Dockerfile 构建服务端镜像并发布到 GHCR 和 Docker Hub。
#
# Required repository secrets for Docker Hub publishing:
#   DOCKERHUB_USERNAME=itangji
#   DOCKERHUB_TOKEN=<Docker Hub access token, not the account password>
#
# Tag strategy / 标签策略:
#   push master       -> :master, :sha-<short sha>   滚动开发版
#   tag v*            -> :v1.2.3, :latest            正式版，由 release.yml 发布
#   pull request      -> 只构建校验，不推送
#   workflow_dispatch -> 自定义标签

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish, for example dev or v1.2.3
        required: true
        default: dev
      platforms:
        description: Target platforms
        required: true
        default: linux/amd64,linux/arm64
        type: choice
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
          - linux/arm64
      push:
        description: Push the built image to GHCR
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERFILE: backend/Dockerfile
  DOCKERHUB_IMAGE: itangji/ktv-home
  # Baked into the image so the TV client can resolve the bundled APK filenames.
  KTV_RELEASE_VERSION: 0.1.0-dev
  KTV_RELEASE_VERSION_CODE: ${{ github.run_number }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Required for every publishing run; pull requests do not push.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase repository names: Mrtangji/ktv-home -> mrtangji/ktv-home.
      - name: Resolve image coordinates
        id: image
        run: |
          set -euo pipefail
          name="ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Image: $name"

      - name: Resolve platforms, push flag and cache target
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_PUSH: ${{ inputs.push }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          platforms="linux/amd64,linux/arm64"
          push=true
          dockerhub_enabled=false
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            dockerhub_enabled=true
          fi
          case "$EVENT_NAME" in
            pull_request)
              # Fork PRs only receive a read-only token, and a single
              # architecture keeps the validation build fast.
              platforms="linux/amd64"
              push=false
              ;;
            workflow_dispatch)
              platforms="$INPUT_PLATFORMS"
              push="$INPUT_PUSH"
              ;;
          esac

          if [ "$push" = "true" ]; then
            cache_from="type=gha"
            cache_to="type=gha,mode=max"
            load=false
          else
            # Fork pull requests only get a read-only token, which the gha
            # cache backend cannot use; skip the cache to keep them green.
            cache_from=""
            cache_to=""
            load=true
          fi
          # The local daemon cannot load a multi-platform build result.
          case "$platforms" in
            *,*) load=false ;;
          esac

          {
            echo "platforms=$platforms"
            echo "push=$push"
            echo "load=$load"
            echo "dockerhub_enabled=$dockerhub_enabled"
            echo "cache_from=$cache_from"
            echo "cache_to=$cache_to"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.plan.outputs.platforms != 'linux/amd64'

      - uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub credentials
        if: steps.plan.outputs.push == 'true'
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error title=Docker Hub secrets are missing::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

      - uses: docker/login-action@v3
        if: steps.plan.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: steps.plan.outputs.push == 'true'
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta_ghcr
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=pr
            type=raw,value=master,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.tag || 'dev' }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Home KTV
            org.opencontainers.image.description=LAN KTV song-request server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/metadata-action@v5
        id: meta_dockerhub
        if: steps.plan.outputs.dockerhub_enabled == 'true'
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=pr
            type=raw,value=master,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.tag || 'dev' }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Home KTV
            org.opencontainers.image.description=LAN KTV song-request server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          # The context must stay at the repository root: the Dockerfile also
          # copies h5/ and dist/tv-apk into the build.
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ steps.plan.outputs.platforms }}
          push: ${{ steps.plan.outputs.push == 'true' }}
          load: ${{ steps.plan.outputs.load == 'true' }}
          tags: |
            ${{ steps.meta_ghcr.outputs.tags }}
            ${{ steps.meta_dockerhub.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          build-args: |
            KTV_RELEASE_VERSION=${{ env.KTV_RELEASE_VERSION }}
            KTV_RELEASE_VERSION_CODE=${{ env.KTV_RELEASE_VERSION_CODE }}
          cache-from: ${{ steps.plan.outputs.cache_from }}
          cache-to: ${{ steps.plan.outputs.cache_to }}

      # Guards against the failure mode where the H5 bundle silently does not
      # end up inside the fat jar, which only shows up as a blank /m page.
      - name: Smoke test the built image
        if: steps.plan.outputs.load == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.meta_ghcr.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -e
            test -f /app/app.jar
            command -v ffmpeg >/dev/null
            command -v ffprobe >/dev/null
            # Zip entry names are stored uncompressed, so grep can find them.
            grep -qa "BOOT-INF/classes/static/m/index.html" /app/app.jar
            echo "image smoke test passed"
          '
