name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/zhayinggang/ktv-home
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  image:
    name: Publish multi-architecture image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_VERSION }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  android-tv:
    name: Build TV APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify FFmpeg extension
        run: echo "9feed2a29f7717955f579eff0373503ef3f8681734b053797fbda3cf62b3a5ab  app/libs/media3-decoder-ffmpeg.aar" | sha256sum -c -
      - name: Prepare release signing keystore
        env:
          KTV_TV_KEYSTORE_BASE64: ${{ secrets.KTV_TV_KEYSTORE_BASE64 }}
        run: |
          test -n "$KTV_TV_KEYSTORE_BASE64"
          printf '%s' "$KTV_TV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/home-ktv-release.keystore"
      - name: Build Debug and signed Release APKs
        env:
          KTV_TV_KEYSTORE: ${{ runner.temp }}/home-ktv-release.keystore
          KTV_TV_STORE_PASSWORD: ${{ secrets.KTV_TV_STORE_PASSWORD }}
          KTV_TV_KEY_ALIAS: ${{ secrets.KTV_TV_KEY_ALIAS }}
          KTV_TV_KEY_PASSWORD: ${{ secrets.KTV_TV_KEY_PASSWORD }}
        run: |
          test -n "$KTV_TV_STORE_PASSWORD"
          test -n "$KTV_TV_KEY_ALIAS"
          test -n "$KTV_TV_KEY_PASSWORD"
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - name: Upload 32-bit Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: home-ktv-tv-${{ env.RELEASE_VERSION }}-debug-armeabi-v7a
          path: android-tv/app/build/outputs/apk/debug/*armeabi-v7a*.apk
          if-no-files-found: error
      - name: Upload 64-bit Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: home-ktv-tv-${{ env.RELEASE_VERSION }}-debug-arm64-v8a
          path: android-tv/app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
      - name: Upload 32-bit Release APK
        uses: actions/upload-artifact@v4
        with:
          name: home-ktv-tv-${{ env.RELEASE_VERSION }}-release-armeabi-v7a
          path: android-tv/app/build/outputs/apk/release/*armeabi-v7a*.apk
          if-no-files-found: error
      - name: Upload 64-bit Release APK
        uses: actions/upload-artifact@v4
        with:
          name: home-ktv-tv-${{ env.RELEASE_VERSION }}-release-arm64-v8a
          path: android-tv/app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error
